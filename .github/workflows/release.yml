name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Static Verification
        run: |
          set -euo pipefail
          bash -n windows-remote-executor/bin/win-remote
          bash -n windows-remote-executor/bin/win-remote-legacy
          bash -n windows-remote-executor/lib/common.sh
          bash -n windows-remote-executor/scripts/verify-remote-cases.sh
          bash -n windows-remote-executor/scripts/verify-v3-local.sh
          bash -n windows-remote-executor/scripts/verify-v3-remote-cases.sh
          bash -n windows-remote-executor/scripts/make-bootstrap-package.sh
          python3 -m py_compile windows-remote-executor/lib/win_remote_cli.py
          python3 -m py_compile windows-remote-executor/lib/wre_v3_client.py
          python3 -m py_compile windows-remote-executor/mcp/win_remote_mcp.py
          python3 -m unittest discover -s windows-remote-executor/tests
          dotnet build windows-remote-executor-native/src/WindowsRemoteExecutor.Native/WindowsRemoteExecutor.Native.csproj \
            -c Release \
            -r win-x64 \
            --self-contained false

      - name: Publish Framework-Dependent Build
        run: ./windows-remote-executor-native/publish-fdd-win-x64.sh

      - name: Publish Self-Contained Build
        run: ./windows-remote-executor-native/publish-scd-win-x64.sh

      - name: Package Assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-assets
          git archive --format=zip --prefix=windows-remote-executor/ -o "release-assets/windows-remote-executor-${TAG}-source.zip" HEAD
          cd windows-remote-executor-native/publish/fdd-win-x64
          zip -rq "../../../release-assets/windows-remote-executor-native-${TAG}-fdd-win-x64.zip" .
          cd ../scd-win-x64
          zip -rq "../../../release-assets/windows-remote-executor-native-${TAG}-scd-win-x64.zip" .
          cd ../../..
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
